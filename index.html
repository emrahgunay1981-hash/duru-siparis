<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duru El Lezzetleri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Marcellus&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: single column menu card, sticky WhatsApp cart bar at the bottom */
:root{
  --bg:#0f0d0a; --panel:#1a1712; --line:#3a3226; --fg:#f3ece0; --muted:#b5a993;
  --gold:#e3c26b; --gold-deep:#b8913a; --wa:#25d366;
  --f-script:"Alex Brush",cursive; --f-head:"Marcellus",Georgia,serif; --f-body:"Nunito Sans",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 140px}
header{text-align:center;display:grid;gap:4px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-head);font-size:1.9rem;letter-spacing:.06em;color:var(--gold);text-wrap:balance}
.tag{font-family:var(--f-script);font-size:1.6rem;color:var(--muted)}
.info{font-size:.9rem;color:var(--muted)}
h2{font-family:var(--f-head);font-weight:400;color:var(--gold);font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase;margin:28px 0 8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:12px;border-bottom:1px dashed var(--line)}
.name{font-weight:600;min-width:0}
.unit{font-size:.85rem;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800;text-align:right}
.qty{grid-column:1/-1;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold-deep);background:transparent;color:var(--gold);font-size:1.3rem;cursor:pointer}
.qty button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qty output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
.item.on .name{color:var(--gold)}
label.f{display:grid;gap:4px;margin-top:12px;font-size:.9rem;color:var(--muted)}
input,textarea{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font:inherit}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--panel)}
.opt input{accent-color:var(--gold)}
.opt:has(input:checked){border-color:var(--gold);color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--gold-deep);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.total{flex:1;min-width:0}
.total small{display:block;color:var(--muted);font-size:.8rem}
.total b{font-size:1.3rem;color:var(--gold);font-variant-numeric:tabular-nums}
.send{background:var(--wa);color:#0b2a16;font-weight:800;border-radius:999px;padding:12px 18px;text-decoration:none;white-space:nowrap}
.send[aria-disabled="true"]{opacity:.4;pointer-events:none}
.note{font-size:.8rem;color:var(--muted);margin-top:20px;text-align:center}
</style>

</head><body style="margin:0">
<div class="wrap">
  <header>
    <div class="brand">DURU EL LEZZETLERİ</div>
    <div class="tag">Hijyen · Lezzet · Kalite</div>
    <div class="info">Yenişehir, İzmit · 0507 805 38 78 · @duru.el.lezzetleri</div>
  </header>
  <main id="menu"></main>
  <label class="f" for="ad">Adınız<input id="ad" placeholder="Ad Soyad"></label>
  <h2>Teslimat</h2>
  <div class="opts" role="radiogroup">
    <label class="opt" for="t-ev"><input type="radio" name="t" id="t-ev" value="ev" checked><span>Eve teslim<br><small class="unit">3.500 ₺ ve üzeri</small></span></label>
    <label class="opt" for="t-dk"><input type="radio" name="t" id="t-dk" value="dk"><span>Dükkandan teslim al</span></label>
  </div>
  <label class="f" id="w-adres" for="adres">Teslim adresi<textarea id="adres" rows="2" placeholder="Mahalle, sokak, bina no, daire"></textarea></label>
  <label class="f" id="w-saat" for="saat" hidden>Teslim alma saati<input id="saat" type="time" value="12:00"></label>
  <label class="f" for="not">Not (isteğe bağlı)<input id="not" placeholder="Örn. akşam 6'dan sonra"></label>
  <p class="note">Siparişiniz WhatsApp'tan doğrudan dükkana iletilir. Ödeme teslimatta nakit veya kredi kartı ile yapılır.</p>
</div>

<div class="bar"><div class="bar-in">
  <div class="total"><small id="count">Ürün seçilmedi</small><b id="sum">0 ₺</b></div>
  <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">WhatsApp'tan Sipariş Ver</a>
</div></div>

<script>
const PHONE="905078053878";
const MENU=[
 ["Öne Çıkan Lezzetlerimiz",[["Baklava","tepsi (2.500 gr)",2500,1],["El açması börek, ıspanaklı-patatesli","tepsi (2.000 gr)",1200,1],["El açması börek, kıymalı","tepsi",1500,1],["İçli köfte","adet",120,1],["Mantı","kilo",850,.5],["Yaprak sarması","kilo",850,.5]]],
 ["Tatlılar",[["Trileçe","tepsi",1500,1],["Kabak tatlısı","kilo",750,.5],["Tartolet","kilo",1250,.5]]],
 ["Kek, Kurabiye, Poğaça",[["Kek","büyük kalıp",900,1],["Islak kek","borcam",1000,1],["Elmalı kurabiye","1 ölçü (30 adet)",1200,1],["Tuzlu kurabiye","1 ölçü",900,1],["Sakallı poğaça","1 ölçü (30 adet)",1200,1],["Mayalı poğaça","1 ölçü (30 adet)",900,1]]],
 ["Diğer Lezzetler",[["Kısır","kilo",850,.5],["Mercimek köfte","kilo",900,.5],["Kuru dolma","kilo",1000,.5],["Gül böreği (donuk)","adet",40,1],["Fellah köfte (donuk)","kilo",650,.5]]]
];
const q={}, fmt=n=>n.toLocaleString("tr-TR")+" ₺", nq=n=>String(n).replace(".",",");
const menu=document.getElementById("menu");
MENU.forEach(([cat,items],ci)=>{
  const h=document.createElement("h2");h.textContent=cat;menu.append(h);
  items.forEach(([name,unit,price,step],ii)=>{
    const id=ci+"-"+ii;q[id]=0;
    const d=document.createElement("div");d.className="item";d.id="i"+id;
    d.innerHTML=`<div class="name">${name}<div class="unit">${unit}</div></div><div class="price">${fmt(price)}</div>
    <div class="qty"><button aria-label="${name} azalt">−</button><output>0</output><button aria-label="${name} artır">+</button></div>`;
    const [m,p]=d.querySelectorAll("button"), o=d.querySelector("output");
    const set=v=>{q[id]=Math.max(0,Math.round(v*2)/2);o.textContent=nq(q[id]);d.classList.toggle("on",q[id]>0);update();};
    m.onclick=()=>set(q[id]-step); p.onclick=()=>set(q[id]+step);
    d._data={name,unit,price};menu.append(d);
  });
});
function update(){
  let sum=0,lines=[],n=0;
  for(const id in q){if(!q[id])continue;const {name,unit,price}=document.getElementById("i"+id)._data;
    const t=q[id]*price;sum+=t;n++;lines.push(`• ${name} (${unit}) x ${nq(q[id])} = ${fmt(t)}`);}
  document.getElementById("sum").textContent=fmt(sum);
  const MIN=3500, evSel=document.getElementById("t-ev").checked, adresYok=!document.getElementById("adres").value.trim();
  let hint=n?n+" çeşit ürün":"Ürün seçilmedi", ok=n>0;
  if(n&&evSel&&sum<MIN){hint=`Eve teslim için ${fmt(MIN-sum)} daha ekleyin`;ok=false;}
  else if(n&&evSel&&adresYok){hint="Teslim adresini yazın";ok=false;}
  document.getElementById("count").textContent=hint;
  const v=i=>document.getElementById(i).value.trim();
  const ev=document.getElementById("t-ev").checked;
  document.getElementById("w-adres").hidden=!ev; document.getElementById("w-saat").hidden=ev;
  const tes=ev?"Eve teslim"+(v("adres")?`\nAdres: ${v("adres")}`:""):`Dükkandan teslim alacağım\nSaat: ${v("saat")||"-"}`;
  const msg=`Merhaba, sipariş vermek istiyorum:\n${lines.join("\n")}\nToplam: ${fmt(sum)}`+(v("ad")?`\nAd: ${v("ad")}`:"")+`\nTeslimat: ${tes}`+(v("not")?`\nNot: ${v("not")}`:"");
  const a=document.getElementById("send");
  a.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
  a.setAttribute("aria-disabled",ok?"false":"true");
}
["ad","adres","saat","not","t-ev","t-dk"].forEach(i=>{const e=document.getElementById(i);e.addEventListener("input",update);e.addEventListener("change",update);});
update();
</script>
</body></html>
